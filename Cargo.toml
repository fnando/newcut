[package]
name = "newcut"
version = "0.0.0"
edition = "2024"
description = "Know which albums you have, which you don't, and what's new from the artists in your music library."
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8"
clap = { version = "4.6.7", features = ["derive", "env"] }
deunicode = "1.6.2"
dotenvy = "0.15.7"
etcetera = "0.11.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jiff = { version = "0.2.38", features = ["serde"] }
libc = "0.2.191"
lofty = "0.25.5"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "form"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "rt-multi-thread", "macros", "fs", "time", "signal", "sync"] }
tokio-util = "0.7.20"
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
unicode-normalization = "0.1.26"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

# Image decoding and resizing (thumbnails) are many times slower
# unoptimized: optimize those even in debug builds.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
